# Configuración de Alembic para uso desde la línea de comandos (desarrollo).
# La app NO usa este archivo: aplica las migraciones sola al arrancar
# (ver src/data/db.py -> migrar()).
#
# Crear una migración nueva tras cambiar src/data/models.py:
#   .\.venv\Scripts\alembic revision --autogenerate -m "descripcion"
# Por defecto trabaja sobre una BD de desarrollo en .\dev_data\ (ver env.py).

[alembic]
script_location = %(here)s/src/data/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
